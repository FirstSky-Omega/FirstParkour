# Built-in IP hologram leaderboards.
#
# Replaces the DecentHolograms / HolographicDisplays softdepends. Uses Paper's modern
# Display API (TextDisplay + ItemDisplay + Interaction), so:
#   - no armor-stand entities (no chunk-ticking cost)
#   - billboarded text that always faces the player
#   - clickable page-flip via an Interaction entity (right-click = next, shift-right = prev)
#   - entities are setPersistent(false) — they vanish on crash and never leak
#
# Lines use MiniMessage tags (https://docs.advntr.dev/minimessage/). PlaceholderAPI
# placeholders like %witp_player_rank_default_1% still resolve as before.
#
# Positioning convention: the `location` Y is the TOP of the visible text — the lines
# grow DOWNWARD from there (DecentHolograms compatible). Icon `offset` is relative to
# that top anchor:
#   - offset Y > 0 : above the title line
#   - offset Y < 0 : below the bottom line
#   - offset X / Z : sideways from the text center
#
# So `offset: '0.0, 0.6, 0.0'` floats the icon ~half a block above the title text.

holograms:

  # ---------- Classic mode leaderboard (top 10, multi-page) ----------
  classic-leaderboard:
    enabled: true
    location: 'pkhub:-4.076:87:3.628:0'
    update-interval-ticks: 40
    interaction:
      width: 1.6
      height: 3.0
      offset-y: -1.4              # click box covers the whole text column
    pages:
      - lines:
          - '<gradient:#1fe7ff:#57fde7>༺ 经典模式排行榜 ༻</gradient>'
          - '<color:#36a1ff>☻ <color:#41ff6c>玩家  <color:#58fe83>-  <color:#74d9ff>⌚ <color:#6ffe9a>用时  <color:#86feb1>-  <color:#0dffd1>♞  <color:#9dfdc8>得分'
          - '<color:#36a1ff>☻ <color:#41ff6c>1. <color:#4dff77>%witp_player_rank_default_1% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%witp_time_rank_default_1% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%witp_score_rank_default_1%'
          - '<color:#36a1ff>☻ <color:#41ff6c>2. <color:#4dff77>%witp_player_rank_default_2% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%witp_time_rank_default_2% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%witp_score_rank_default_2%'
          - '<color:#36a1ff>☻ <color:#41ff6c>3. <color:#4dff77>%witp_player_rank_default_3% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%witp_time_rank_default_3% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%witp_score_rank_default_3%'
          - '<color:#36a1ff>☻ <color:#41ff6c>4. <color:#4dff77>%witp_player_rank_default_4% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%witp_time_rank_default_4% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%witp_score_rank_default_4%'
          - '<color:#36a1ff>☻ <color:#41ff6c>5. <color:#4dff77>%witp_player_rank_default_5% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%witp_time_rank_default_5% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%witp_score_rank_default_5%'
          - ''
          - '<aqua><bold>「 右键翻页 / 潜行右键回退 」</bold></aqua>'
        icons:
          - material: GOLDEN_BOOTS
            enchanted: true
            offset: '0.0,0.6,0.0'
            scale: 0.6
      - lines:
          - '<gradient:#1fe7ff:#57fde7>༺ 经典模式 6–10 ༻</gradient>'
          - '<color:#36a1ff>☻ <color:#41ff6c>玩家  <color:#58fe83>-  <color:#74d9ff>⌚ <color:#6ffe9a>用时  <color:#86feb1>-  <color:#0dffd1>♞  <color:#9dfdc8>得分'
