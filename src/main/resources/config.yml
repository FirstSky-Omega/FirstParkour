  land: BLOCK_NOTE_BLOCK_PLING
  land-volume: 1.0
  land-pitch: 1.2
  record: UI_TOAST_CHALLENGE_COMPLETE
  record-volume: 1.0
  record-pitch: 1.0
  fall: ENTITY_VILLAGER_HURT
  fall-volume: 1.0
  fall-pitch: 0.8
  milestone: ENTITY_PLAYER_LEVELUP
  milestone-volume: 1.0
  milestone-pitch: 1.0

particles:
  enabled: true
  land:
    type: HAPPY_VILLAGER
    count: 8
  record:
    type: TOTEM_OF_UNDYING
    count: 30
  fall:
    type: SMOKE_NORMAL
    count: 15
  milestone:
    type: FIREWORK
    count: 20

