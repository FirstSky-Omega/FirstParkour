  pool-size: 10

parkour:
  # Monde dédié au parkour.
  # Laissez vide '' pour générer le parkour là où se trouve le joueur.
  # Le monde doit exister sur le serveur (créé via un plugin de gestion de mondes ou dans bukkit.yml).
  world: ''

  # Point de départ dans le monde de parkour.
  # Utilisez /parkour definirespawn pour le définir en jeu.
  spawn:
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

  # Nombre de blocs générés en avance
  blocks-ahead: 3
  # Nombre de blocs conservés derrière le joueur
  history-size: 12
  # Mettre le joueur en mode ADVENTURE pendant le parkour
  force-adventure: true
  # Désactiver les dégâts pendant le parkour
  disable-damage: true
  # Envoyer le score en action bar
  action-bar: true
  # Fréquence d'actualisation du classement (en secondes)
  leaderboard-refresh: 60

difficulties:
  easy:
    display-name: '&aFacile'
    nexo-item: 'parkour_easy'
    min-distance: 2
    max-distance: 3
    min-height: -1
    max-height: 1
    angle-spread: 25.0
    blocks:
      - GRASS_BLOCK
      - OAK_PLANKS
      - BIRCH_PLANKS
      - DIRT
      - STONE
      - COBBLESTONE

  medium:
    display-name: '&eNormal'
    nexo-item: 'parkour_medium'
    min-distance: 2
    max-distance: 4
    min-height: -1
    max-height: 2
    angle-spread: 40.0
    blocks:
      - STONE
      - COBBLESTONE
      - OAK_PLANKS
      - BRICKS
      - SANDSTONE
      - SPRUCE_PLANKS

  hard:
    display-name: '&cDifficile'
    nexo-item: 'parkour_hard'
    min-distance: 3
    max-distance: 5
    min-height: -2
    max-height: 2
    angle-spread: 55.0
    blocks:
      - OBSIDIAN
      - NETHERRACK
      - MAGMA_BLOCK
      - BLACKSTONE
      - END_STONE
      - SOUL_SAND

messages:
  prefix: '&8[&6FirstParkour&8] '
  start: '&aParkour &6{difficulty} &adémarré ! Bonne chance !'
  stop: '&cParkour arrêté. Score final: &6{score} &cblocs.'
  new-record: '&6✦ NOUVEAU RECORD ! &e{score} &6blocs !'
  no-permission: '&cVous n''avez pas la permission.'
  already-playing: '&cVous jouez déjà ! Faites &e/parkour stop &cpour arrêter.'
  not-playing: '&cVous ne jouez pas au parkour.'
  spawn-set: '&aSpawn du parkour défini ici (monde: &e{world}&a).'
  world-not-found: '&cMonde de parkour &e{world} &cintrouvable ! Vérifiez la config.'
  reload: '&aConfiguration rechargée.'
  score-actionbar: '&6Score: &e{score} &7| &6Record: &e{best}'
  fall: '&cVous êtes tombé ! Score final: &6{score} &cblocs.'

  top-header: '&8&m------&r &6Classement Parkour &7({difficulty}) &8&m------'
  top-line: '&7#{rank} &e{name} &7- &6{score} blocs'
  top-empty: '&7Aucun score enregistré.'

  stats-header: '&8&m------&r &6Vos Stats &8&m------'
  stats-easy: '  &7Facile: &a{score}'
  stats-medium: '  &7Normal: &e{score}'
  stats-hard: '  &7Difficile: &c{score}'
  stats-jumps: '  &7Total sauts: &6{jumps}'

  # Worlds
  world-unloaded: '&cLe monde de parkour a été déchargé. Session arrêtée.'

  # Duel
  duel-reconnect: '&aReconnecté ! Score restauré: &6{score}'
  duel-opponent-disconnected: '&e{player} &7s''est déconnecté. &c{seconds}s &7pour reconnecter.'
  duel-opponent-reconnected: '&e{player} &7a reconnecté au duel !'
  duel-win-by-dc: '&a✔ Victoire ! Votre adversaire s''est déconnecté. Score: &6{score}'

  # Spectateur
  spectator-join: '&7Vous regardez le duel de &e{player1} &7vs &e{player2}&7.'
  spectator-quit: '&7Vous avez quitté le mode spectateur.'

themes:
  nether:
    display-name: '&cNether'
    blocks: [NETHERRACK, BLACKSTONE, CRIMSON_PLANKS, NETHER_BRICKS, BASALT]

  end:
    display-name: '&5The End'
    blocks: [END_STONE, PURPUR_BLOCK, OBSIDIAN, END_STONE_BRICKS, CRYING_OBSIDIAN]

  ocean:
    display-name: '&9Océan'
    blocks: [PRISMARINE, PRISMARINE_BRICKS, DARK_PRISMARINE, SEA_LANTERN, BLUE_TERRACOTTA]

  winter:
    display-name: '&bHiver'
    blocks: [PACKED_ICE, SNOW_BLOCK, ICE, BLUE_ICE, WHITE_CONCRETE]

  desert:
    display-name: '&eDésert'
    blocks: [SANDSTONE, SMOOTH_SANDSTONE, CUT_SANDSTONE, TERRACOTTA, ORANGE_TERRACOTTA]

  sky:
    display-name: '&fNuages'
    blocks: [WHITE_WOOL, LIGHT_BLUE_WOOL, WHITE_CONCRETE, GLASS, QUARTZ_BLOCK]

  jungle:
    display-name: '&aJungle'
    blocks: [JUNGLE_LOG, JUNGLE_PLANKS, MOSSY_COBBLESTONE, OAK_LEAVES, VINE]

gui:
  # Titre du menu principal.
  # Pour un fond Nexo (texture full-screen via glyph) : '&8✦ &6FirstParkour &8✦'
  # Remplacez  par le caractère Unicode de votre glyph Nexo.
  title: '&8✦ &6FirstParkour &8✦'

  # Titre du menu des thèmes
  theme-title: '&8✦ &6Thèmes de Blocs &8✦'

  rows: 3

  # Slots des boutons (0-based)
  easy-slot: 11
  medium-slot: 13
  hard-slot: 15
  themes-slot: 20
  stats-slot: 24
  close-slot: 26

  # Slots supplémentaires
  global-slot: 22
  daily-slot: 4

  # IDs d'items Nexo pour chaque bouton des menus.
  # Laissez vide '' pour utiliser les items vanilla par défaut.
  nexo-items:
    filler: ''           # Fond de menu
    easy: ''             # Bouton Facile   (ou déjà défini dans difficulties.easy.nexo-item)
    medium: ''           # Bouton Normal
    hard: ''             # Bouton Difficile
    themes: ''           # Bouton Thèmes
    stats: ''            # Bouton Stats
    close: ''            # Bouton Fermer
    back: ''             # Bouton Retour (menu thèmes)
    global: ''           # Bouton Classement Global
    daily: ''            # Bouton Défi du Jour

    # Items des thèmes dans le menu de sélection
    theme-default: ''
    theme-nether: ''
    theme-end: ''
    theme-ocean: ''
    theme-winter: ''
    theme-desert: ''
    theme-sky: ''
    theme-jungle: ''

# ──────────────────────────────────────────────
#  Sons & Particules
# ──────────────────────────────────────────────
