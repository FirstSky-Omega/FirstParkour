# ──────────────────────────────────────────────
#  Défi quotidien
# ──────────────────────────────────────────────
daily:
  # Difficulté du défi : RANDOM (tourne selon le jour), easy, medium, hard
  difficulty: RANDOM

# ──────────────────────────────────────────────
#  Duel
# ──────────────────────────────────────────────
duel:
  # Secondes accordées à un joueur déconnecté pour reconnecter
  disconnect-grace-seconds: 30
