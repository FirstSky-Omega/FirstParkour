name: FirstParkour
version: 1.0.0
main: fr.firstsky.firstparkour.FirstParkour
api-version: '26.2'
description: Parkour infini per-joueur avec classements
authors: [FirstSky]

softdepend:
  - PlaceholderAPI
  - Nexo
  - TAB

commands:
  parkour:
    description: Commande principale du parkour
    usage: /parkour [arreter|stats|classement|duel|themes|definirespawn|recharger]
    aliases: [pk]

permissions:
  firstparkour.use:
    description: Permet de jouer au parkour
    default: true
  firstparkour.admin:
    description: Commandes administrateur
    default: op
