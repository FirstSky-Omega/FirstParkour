# IP built-in leaderboard holograms — full port of the user's DecentHolograms layout
# (holograms/leaderboard.yml + ipp_leaderboard.yml + introduction.yml + the icon-only
# helpers) into the modern Display API.
#
# Positioning convention: `location` Y is the TOP of the visible text (DH-compatible).
# Text grows downward. Icon `offset` Y > 0 floats above the title line.

holograms:

  # ---------- Intro sign at the parkour entrance ----------
  introduction:
    enabled: true
    location: 'pkhub:-8.962:84.252:2.157:0'
    update-interval-ticks: 200
    interaction:
      width: 0.1
      height: 0.1
      offset-y: 0.0
    pages:
      - lines:
          - '<green><bold>前方可练习跑酷~'
          - '<red><bold>更完善的模式与内容正在建设之中...'

