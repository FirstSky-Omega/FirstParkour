# -= Infinite Elytra Parkour =-
# by Efnilite (https://efnilite.dev)
# (c) 2024

# Need help?
# Join my Discord (https://efnilite.dev/discord) or email me (https://efnilite.dev/#contact).

# -= Debug =-
debug: false

# -= Join on join =-
# If true, players that join the server will join the parkour.
join-on-join: false

# -= Permissions =-
# If true, the plugin will use permissions
permissions: false

# -= Time format =-
# H = hours, m = minutes, s = seconds, S = milliseconds
time-format: mm:ss:SSS

# -= Proxy =-
proxy:
  
  # -= Proxy enabled? =-
  enabled: false
  
  # -= Return server =-
  # If enabled, the server players will be sent to on leave.
  return-server: lobby

# -= MySQL =-
mysql:
  
  # -= MySQL enabled? =-
  enabled: false
  
  url: localhost:3306/iep
  username: username
  password: password
  prefix: ''

# -= Mode settings =-
mode-settings:
  close:
    enabled: true
  
  min-speed:
    enabled: true
    
    # -= The min speed =-
    # The min speed in m/s
    min-speed: 35.0
    
    # -= Actionbar length =-
    # The length of the actionbar
    actionbar-length: 30
  
  obstacle:
    enabled: true
  
  speed-demon:
    enabled: true
  
  time-trial:
    enabled: true
    
    # -= Seed =-
    # The seed all players will use to play time trial.
    # Should be a value between 0 and 1,000,000.
    seed: 0
    
    # -= Score =-
    # The score the player needs to reach to complete the parkour
    score: 2500.0
    
    # -= Actionbar length =-
    # The length of the actionbar
    actionbar-length: 30

# -= Options for the settings in the settings menu =-
settings:
  
  style:
    enabled: true
    default: cherry
  
  radius:
    enabled: true
    # Should be a value between 3 and 6.
    default: 5
  
  time:
    enabled: true
    # Should be a value between 0 and 24000.
    default: 0
  
  seed:
    enabled: true
    # Should be a value between 0 and 1,000,000.
    default: -1
  
  locale:
    enabled: true
    default: zh_cn
  
  fall:
    enabled: true
    default: true
  
  info:
    enabled: true
    default: false
  
  metric:
    enabled: true
    default: true
